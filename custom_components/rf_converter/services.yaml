reload_remote:
  name: Reload remote
  description: Reload remote controller data from the vendor server.

send_command:
  name: Send command
  description: Send an RF command.
  fields:
    remote:
      name: Remote
      description: Name of the remote controller.
      example: 'My Remote'
      required: true
      selector:
        text:
    key:
      name: Key
      description: Name of the key.
      example: 'Power On'
      required: true
      selector:
        text:
